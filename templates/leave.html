{% extends "base.html" %}

{% block title %}Apply Leave{% endblock %}
{% block page_title %}Apply Leave{% endblock %}

{% block content %}
<section class="panel">
    <form action="/submit_leave" method="POST" class="form-grid">
        <label>
            Leave Type
            <select name="leave_type" required>
                <option value="CL">Casual Leave</option>
                <option value="SL">Sick Leave</option>
                <option value="LWP">Leave Without Pay</option>
            </select>
        </label>

        <label>
            Duration
            <select name="leave_duration" id="leaveDuration" required>
                <option value="full_day">Full Day</option>
                <option value="half_day">Half Day</option>
            </select>
        </label>

        <label>
            From Date
            <input type="date" name="from_date" required>
        </label>

        <label>
            To Date
            <input type="date" name="to_date" required>
        </label>

        <label class="full-width">
            Reason
            <textarea name="reason" rows="4" required></textarea>
        </label>

        <div class="button-row full-width">
            <button type="submit">Submit Request</button>
            <a class="button secondary" href="/dashboard">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}

{% block scripts %}
<script>
const duration = document.getElementById("leaveDuration");
const fromDate = document.querySelector('[name="from_date"]');
const toDate = document.querySelector('[name="to_date"]');

function syncHalfDayDate() {
    const halfDay = duration.value === "half_day";
    if (halfDay && fromDate.value) toDate.value = fromDate.value;
    toDate.readOnly = halfDay;
}

duration.addEventListener("change", syncHalfDayDate);
fromDate.addEventListener("change", syncHalfDayDate);
</script>
{% endblock %}
